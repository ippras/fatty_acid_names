[package]
name = "fatty_acid_names"
version = "0.1.0"
authors = ["Giorgi Vladimirovich Kazakov", "Roman Alexandrovich Sidorov"]
edition = "2024"

[dependencies]
const_format = "0.2.36"
typed-builder = "0.23.2"

egui_l10n = { git = "https://github.com/ippras/egui_l10n", branch = "egui-0.36", features = [
    "macros",
] }

egui = { version = "0.36.2", optional = true }
egui-phosphor = { version = "0.14.0", optional = true }
lipid = { git = "https://github.com/ippras/lipid", branch = "0.52", features = [
    "serde",
], optional = true }

[features]
default = ["egui", "lipid"]

egui = ["dep:egui", "dep:egui-phosphor"]
